name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: renderlab
          POSTGRES_PASSWORD: renderlab
          POSTGRES_DB: renderlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renderlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test

      - name: API integration tests (real Postgres)
        run: pnpm --filter @renderlab/api test:integration
        env:
          DATABASE_URL: postgres://renderlab:renderlab@localhost:5432/renderlab_test
